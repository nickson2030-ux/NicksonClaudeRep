name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed for the Pages deployment flow
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages must already be enabled with Source = "GitHub Actions" under
      # Settings -> Pages. enablement:true asks the API to turn it on, but the
      # default GITHUB_TOKEN cannot be granted the repo-administration scope
      # that creating a Pages site requires, so first-time enablement is a
      # one-off manual step. Once done, this step is a no-op that just reads
      # the existing Pages config.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # No build step: the site is the repo root, served as static files.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
